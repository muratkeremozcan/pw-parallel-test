# Duration-balanced shards through playwright-smart-parallelization, dispatched by hand to compare
# with native.yml. Set up as the Action's README shows: the shard job of native.yml with the
# Action's step before the Playwright command and $PSP_ARGS after it, and the Action's optional
# finish in the merge job. Results are collected with scripts/measure/collect.ts; see
# results/README.md.
name: Smart shards
# The token lets scripts/measure/campaign.ts find the exact run it dispatched.
run-name: Smart shards ${{ inputs.shards }} enabled=${{ inputs.enabled }}${{ inputs.workers && format(' workers={0}', inputs.workers) || '' }}${{ inputs.fully-parallel && ' fully-parallel=true' || '' }} ${{ inputs.token }}

on:
  workflow_dispatch:
    inputs:
      shards:
        description: Number of shards
        type: number
        required: true
        default: 4
      enabled:
        description: false runs plain --shard with an empty PSP_ARGS (the rollback switch)
        type: boolean
        default: true
      workers:
        description: Workers per shard, passed as --workers and through the Action's workers input; empty keeps the config's 1
        type: string
        required: false
        default: ''
      fully-parallel:
        description: true runs the suite with fullyParallel on, through PW_FULLY_PARALLEL
        type: boolean
        default: false
      token:
        description: Dispatch token set by scripts/measure/campaign.ts
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read # finish reads the jobs API for the per-shard overhead in its summary

# Shares native.yml's group, so a smart run and a native run never execute at the same time.
concurrency:
  group: shard-measurement
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - name: Validate shard count and workers, and build the matrix
        id: plan
        env:
          # Security: inputs passed through env: to prevent script injection
          SHARDS: ${{ inputs.shards }}
          WORKERS: ${{ inputs.workers }}
        run: |
          if ! [[ "$SHARDS" =~ ^[1-9][0-9]?$ ]] || (( 10#$SHARDS > 16 )); then
            echo "::error::shards must be an integer from 1 to 16, got '$SHARDS'"
            exit 1
          fi
          if [ -n "$WORKERS" ] && ! [[ "$WORKERS" =~ ^[1-9]$ ]]; then
            echo "::error::workers must be empty or an integer from 1 to 9, got '$WORKERS'"
            exit 1
          fi
          echo "total=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "shards=$(seq -s, 1 "$SHARDS" | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"

  shard:
    name: Shard ${{ matrix.shard }}/${{ needs.plan.outputs.total }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # The same in every shard: each decides from the one snapshot the run pinned.
      mode: ${{ steps.psp.outputs.mode }}
      reason: ${{ steps.psp.outputs.reason }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # No browser install: no test opens a browser, and native.yml installs none either.
      - run: npm ci
      - id: psp
        uses: muratkeremozcan/playwright-smart-parallelization@c4397380bf518ee0970e1eb346fde580ffd0ab3b
        with:
          enabled: ${{ inputs.enabled }}
          workers: ${{ inputs.workers }}
          # One history per shard count and fullyParallel setting, so each arm warms from a cold
          # run of its own. The key adds to the workers, which the Action keys on by itself.
          history-key: shards-${{ inputs.shards }}${{ inputs.fully-parallel && '-fully-parallel' || '' }}
          # Campaign runs of a pull request publish into its branch's own cache scope, so its
          # warm runs balance from the history its cold run published. On main this is auto.
          publish-history: 'true'
      # The workers go in the command too: a rollback empties $PSP_ARGS, and the run keeps them.
      - name: Run tests
        env:
          WORKERS: ${{ inputs.workers && format('--workers={0}', inputs.workers) || '' }}
          PW_FULLY_PARALLEL: ${{ inputs.fully-parallel }}
        run: npx playwright test --shard=${{ matrix.shard }}/${{ needs.plan.outputs.total }} $WORKERS $PSP_ARGS
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 30

  merge:
    name: Merge reports
    needs: [plan, shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge blob reports
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME=merged-report.json \
            npx playwright merge-reports --reporter=html,json ./all-blob-reports
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            merged-report.json
          retention-days: 30
      - name: Reconcile executed and discovered tests
        run: node scripts/check-test-count.ts merged-report.json "${{ needs.plan.outputs.total }}"
      - id: psp
        if: ${{ !cancelled() }}
        uses: muratkeremozcan/playwright-smart-parallelization/finish@c4397380bf518ee0970e1eb346fde580ffd0ab3b
      # Keeps the Action's outputs after the run, for scripts/measure/collect.ts.
      - name: Record the Action's decision
        if: ${{ !cancelled() }}
        env:
          MODE: ${{ needs.shard.outputs.mode }}
          REASON: ${{ needs.shard.outputs.reason }}
          FINISH_MODE: ${{ steps.psp.outputs.mode }}
          COVERAGE: ${{ steps.psp.outputs.coverage }}
          OVERHEAD_MS: ${{ steps.psp.outputs.overhead-ms }}
        run: |
          mkdir -p psp-decision
          node -e '
            const e = process.env;
            const decision = {
              mode: e.MODE, reason: e.REASON, finishMode: e.FINISH_MODE, coverage: e.COVERAGE,
              overheadMs: e.OVERHEAD_MS === "" ? null : Number(e.OVERHEAD_MS),
            };
            require("fs").writeFileSync("psp-decision/decision.json", JSON.stringify(decision) + "\n");
          '
          cat psp-decision/decision.json
      - name: Upload the Action's decision
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: psp-decision
          path: psp-decision/
          retention-days: 30
