# Test pipeline, scaffolded with BMad TEA (bmad-tea-framework).
# Stack: synthetic Playwright suite with no browser surface, so no browser install or cache.
name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly burn-in of the whole suite, Sundays 02:00 UTC
    - cron: '0 2 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:scripts

  test:
    name: Test (shard ${{ matrix.shard }}/4)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 14

  report:
    name: Merge reports
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge blob reports
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME=merged-report.json \
          PLAYWRIGHT_JUNIT_OUTPUT_NAME=junit.xml \
            npx playwright merge-reports --reporter=html,json,junit ./all-blob-reports
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            merged-report.json
            junit.xml
          retention-days: 14
      - name: Reconcile executed and discovered test counts
        run: node scripts/check-test-count.ts merged-report.json 4

  burn-in:
    name: Burn-in
    needs: lint
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Burn in changed tests
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run test:burn-in-changed -- --base-branch=origin/main
      - name: Burn in whole suite
        if: ${{ github.event_name == 'schedule' }}
        env:
          PW_BURN_IN: 'true'
        run: npx playwright test --repeat-each=3 --retries=0
      - name: Upload burn-in failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: burn-in-failures
          path: test-results/
          retention-days: 14
